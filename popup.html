<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Bugzilla NEW Counter</h1>
    <p id="status" class="status">Checking this tab…</p>
    <button id="toggle" disabled>Please wait…</button>
    <p id="error" class="error" hidden></p>
    <p class="hint">
      Enabling only affects the current tab. Other tabs, including other
      Bugzilla tabs, are unaffected.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
