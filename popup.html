<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Bugzilla Counter</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <header class="header">
    <img class="logo" src="icon.svg" alt="" width="34" height="34">

    <div>
      <h1>Bugzilla Counter</h1>
      <p>Bug monitor</p>
    </div>
  </header>


  <main>

    <section class="switch-card">

      <div class="status-info">
        <strong id="status">
          Monitoring OFF
        </strong>

        <span id="status-detail">
          This tab is not being monitored
        </span>
      </div>

      <button
        id="toggle"
        class="switch"
        role="switch"
        aria-checked="false"
        aria-label="Toggle monitoring for this tab"
        disabled
      >
        <span class="switch-track">
          <span class="switch-thumb"></span>
        </span>
      </button>

    </section>


    <section class="counts-row">

      <div class="count-item new-item">
        <span class="count-number" id="new-count">—</span>
        <span class="count-label">NEW</span>
      </div>

      <div class="count-divider"></div>

      <div class="count-item resp-item">
        <span class="count-number" id="resp-count">—</span>
        <span class="count-label">RESP</span>
      </div>

      <div class="count-divider"></div>

      <div class="count-item total-item">
        <span class="count-number" id="total-count">—</span>
        <span class="count-label">TOTAL</span>
      </div>

    </section>


    <div class="updated-row">
      <span
        id="status-dot"
        class="status-dot off"
      ></span>
      <span class="small-label">UPDATED</span>
      <span id="last-updated">—</span>
    </div>


    <div
      id="error"
      class="error"
      hidden
    ></div>


    <p class="hint">
      Monitoring applies only to this tab.
    </p>

  </main>


  <footer>
    <span>Bugzilla Counter</span>
    <span>v1.0.2</span>
  </footer>


  <script src="popup.js"></script>

</body>
</html>
